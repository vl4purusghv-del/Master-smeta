<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мастер.Смета</title>
<style>
:root{--host-bg:#ffffff;--host-fg:#111827;--host-fg-muted:#6b7280;--host-card:#f9fafb;--host-card-fg:#111827;--host-input:#ffffff;--host-border:#d1d5db;--host-border-hover:#2563eb;--host-primary:#2563eb;--host-secondary:#f3f4f6;--host-secondary-fg:#111827;--host-success:#16a34a;--host-error:#dc2626}
@media (prefers-color-scheme:dark){:root{--host-bg:#111827;--host-fg:#f9fafb;--host-fg-muted:#9ca3af;--host-card:#1f2937;--host-card-fg:#f9fafb;--host-input:#1f2937;--host-border:#374151;--host-border-hover:#3b82f6;--host-primary:#3b82f6;--host-secondary:#374151;--host-secondary-fg:#f9fafb;--host-success:#22c55e;--host-error:#ef4444}}
body{margin:0;padding:16px;background:var(--host-bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ms{max-width:480px;margin:0 auto;color:var(--host-fg);font-size:14px;line-height:1.4}
.ms *{box-sizing:border-box}
.ms h2{font-size:18px;font-weight:500;margin:0 0 2px}
.ms h3{font-size:14px;font-weight:500;margin:16px 0 8px}
.ms .sub{font-size:12px;color:var(--host-fg-muted);margin:0 0 12px}
.ms input,.ms select{background:var(--host-input);color:var(--host-fg);border:1px solid var(--host-border);border-radius:8px;padding:8px 10px;font-size:16px;font-family:inherit;width:100%}
.ms input:focus,.ms select:focus{outline:none;border-color:var(--host-border-hover)}
.ms label{display:block;font-size:12px;color:var(--host-fg-muted);margin-bottom:10px}
.ms label input,.ms label select{margin-top:4px}
.ms button,.ms .btn{font-family:inherit;font-size:14px;border-radius:8px;padding:8px 12px;border:1px solid var(--host-border);background:var(--host-secondary);color:var(--host-secondary-fg);cursor:pointer;display:inline-block;text-decoration:none;line-height:1.4}
.ms button.pri,.ms .btn.pri{background:var(--host-primary);color:#fff;border-color:var(--host-primary)}
.ms button.x{padding:2px 8px;font-size:12px;background:transparent;color:var(--host-fg-muted)}
.ms button.chip{padding:3px 0;width:30px;font-size:12px;text-align:center}
.ms button.chip.on{background:var(--host-primary);color:#fff;border-color:var(--host-primary)}
.ms button.vrow{display:flex;justify-content:space-between;width:100%;margin-bottom:6px;text-align:left}
.ms button.vrow.on{border:2px solid var(--host-primary);padding:7px 11px;font-weight:500}
.ms .chips{display:flex;gap:4px;flex-shrink:0}
.ms .tabs{display:flex;border-bottom:1px solid var(--host-border);margin-bottom:14px}
.ms .tabs button{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 2px;font-size:13px;color:var(--host-fg-muted)}
.ms .tabs button.on{color:var(--host-fg);border-bottom-color:var(--host-primary);font-weight:500}
.ms .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ms .grow{flex:1;min-width:0}
.ms .card{background:var(--host-card);color:var(--host-card-fg);border:1px solid var(--host-border);border-radius:12px;padding:12px;margin-bottom:10px}
.ms .it{border-bottom:1px solid var(--host-border);padding:8px 0}
.ms .itn{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.ms .itr{display:grid;grid-template-columns:80px 40px 12px 96px 1fr;gap:6px;align-items:center;font-size:13px}
.ms .itr input{padding:6px 8px}
.ms .itr .sm{text-align:right;font-weight:500}
.ms .itr.hd{font-size:11px;color:var(--host-fg-muted);margin-bottom:2px}
.ms .mut{color:var(--host-fg-muted);font-size:12px}
.ms .hint{font-size:12px;color:var(--host-fg-muted);margin:0 0 10px}
.ms .kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.ms .kv.big{font-size:16px;font-weight:500;border-top:1px solid var(--host-border);margin-top:6px;padding-top:8px}
.ms .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ms .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ms pre{white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0;color:var(--host-card-fg)}
.ms .ok{color:var(--host-success)}
.ms .bad{color:var(--host-error)}
.ms .wrap{display:flex;flex-wrap:wrap;gap:8px}
.ms .seg button.on{border-color:var(--host-primary);font-weight:500}
#pr{display:none}
@media print{
 body{background:#fff!important;padding:0!important}
 .ms{display:none!important}
 #pr{display:block;color:#000;font-family:"Times New Roman",Times,serif;font-size:12pt;line-height:1.35}
 #pr h1{font-size:15pt;text-align:center;margin:0 0 12pt}
 #pr h3{font-size:12pt;margin:10pt 0 4pt}
 #pr table{width:100%;border-collapse:collapse;margin:4pt 0}
 #pr th,#pr td{border:1px solid #000;padding:3pt 5pt;vertical-align:top;text-align:left}
 #pr td.n{text-align:right;white-space:nowrap}
 #pr table.meta td{border:none;padding:1pt 0}
 #pr p{margin:6pt 0}
 #pr .sign{display:flex;justify-content:space-between;gap:20pt;margin-top:30pt}
 #pr .sign div{flex:1}
 @page{margin:15mm}
}
</style>
</head>
<body>
<div class="ms" id="ms"></div>
<div id="pr"></div>
<script>
(function(){
var KEY='masterSmeta_v1';
var root=document.getElementById('ms');
var pr=document.getElementById('pr');
var VN=['Эконом','Стандарт','Премиум'],VS=['Э','С','П'];
var BR=[6,10,16,20,25,32,40,50,63,80];
var SEC=[{s:1.5,b:10},{s:2.5,b:16},{s:4,b:25},{s:6,b:32},{s:10,b:40},{s:16,b:63},{s:25,b:80}];
var CP={1:{1.5:75,2.5:115,4:180,6:270,10:450,16:700,25:1100},3:{1.5:120,2.5:190,4:300,6:440,10:730,16:1150,25:1800}};
var TPL={
 flat:{title:'Квартира 1-комн.',items:[
  ['work','Штробление стен','м',60,350],['work','Прокладка кабеля','м',250,90],['work','Установка подрозетника','шт',35,350],
  ['work','Монтаж розеток и выключателей','шт',35,300],['work','Сборка щита','модуль',18,400],
  ['mat','Кабель ВВГнг(А)-LS 3×2,5','м',150,115],['mat','Кабель ВВГнг(А)-LS 3×1,5','м',100,75],['mat','Подрозетник','шт',35,25],
  ['mat','Щит на 18 модулей','шт',1,2500],['mat','Автомат 1P 16 А','шт',8,350],['mat','Автомат 1P 10 А','шт',3,320],['mat','УЗО 40 А 30 мА','шт',2,2500]]},
 board:{title:'Щит на 12 модулей',items:[
  ['work','Сборка щита','модуль',12,400],['work','Подключение линии в щите','шт',6,500],
  ['mat','Щит на 12 модулей','шт',1,1800],['mat','Автомат вводной 2P 40 А','шт',1,900],['mat','Автомат 1P 16 А','шт',4,350],
  ['mat','Автомат 1P 10 А','шт',2,320],['mat','УЗО 40 А 30 мА','шт',1,2500],['mat','Шина, гребёнка, наконечники','компл.',1,900]]},
 house:{title:'Частный дом 15 кВт',items:[
  ['work','Монтаж вводного кабеля','м',30,250],['work','Сборка щита','модуль',36,400],['work','Прокладка кабеля','м',600,90],
  ['work','Установка подрозетника','шт',70,350],['work','Монтаж розеток и выключателей','шт',70,300],['work','Монтаж контура заземления','шт',1,15000],
  ['mat','Кабель ВВГнг(А)-LS 5×10','м',30,730],['mat','Кабель ВВГнг(А)-LS 3×2,5','м',350,115],['mat','Кабель ВВГнг(А)-LS 3×1,5','м',250,75],
  ['mat','Щит на 36 модулей','шт',1,5500],['mat','Автомат вводной 3P 25 А','шт',1,1200],['mat','Автомат 1P 16 А','шт',14,350],
  ['mat','Автомат 1P 10 А','шт',6,320],['mat','УЗО 40 А 30 мА','шт',4,2500],['mat','Подрозетник','шт',70,25]]}
};
var UPG=[
 {t:'Реле напряжения',v:[false,true,true],items:[['mat','Реле напряжения 63 А','шт',1,3500],['work','Установка реле напряжения','шт',1,800]]},
 {t:'Маркировка и схема на щите',v:[false,true,true],items:[['work','Маркировка линий и схема на дверце щита','шт',1,1500]]},
 {t:'Защита от перенапряжения (УЗИП)',v:[false,false,true],items:[['mat','Ограничитель перенапряжения (УЗИП)','шт',1,4500],['work','Установка УЗИП','шт',1,1000]]},
 {t:'Защита от искрения (УЗДП)',v:[false,false,true],items:[['mat','Устройство защиты от дугового пробоя (УЗДП)','шт',2,6000],['work','Установка УЗДП','шт',2,500]]},
 {t:'Розетки премиум-серии',v:[false,false,true],items:[['mat','Доплата за розетки и выключатели премиум-серии','шт',10,400]]}
];
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function rub(n){return Math.round(n).toLocaleString('ru-RU')}
function fmt(n){return (+n).toLocaleString('ru-RU')}
function sstr(s){return String(s).replace('.',',')}
function newObj(name,n){return {id:uid(),num:n,name:name,client:'',phone:'',address:'',items:[],lines:[],pay:null,opt:false,ch:1}}
function fresh(){
 var o=newObj('Объект 1',1);
 return {objects:[o],cur:o.id,tab:'obj',seq:1,doc:'kp',pct:30,
  calc:{name:'Розетки кухня',P:3,phase:1,L:20,cos:0.95},
  add:{type:'work',name:'',unit:'шт',qty:1,price:0}};
}
function norm(s){
 if(!s.me)s.me={name:'',phone:'',inn:'',war:12};
 if(!s.add)s.add={type:'work',name:'',unit:'шт',qty:1,price:0};
 if(!s.calc)s.calc={name:'Розетки кухня',P:3,phase:1,L:20,cos:0.95};
 if(!s.tab)s.tab='obj';
 if(!s.doc)s.doc='kp';
 if(s.pct==null)s.pct=30;
 if(!s.seq)s.seq=s.objects.length;
 s.objects.forEach(function(o){
  if(o.phone==null)o.phone='';
  if(!o.items)o.items=[];
  if(!o.lines)o.lines=[];
  if(o.opt==null)o.opt=false;
  if(o.ch==null)o.ch=1;
  o.items.forEach(function(i){if(!i.vs||i.vs.length!==3)i.vs=[true,true,true]});
 });
 return s;
}
function load(){
 var s=null;
 try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!(s&&s.objects&&s.objects.length))s=fresh();
 return norm(s);
}
var st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function cur(){var o=st.objects.filter(function(x){return x.id===st.cur})[0];if(!o){o=st.objects[0];st.cur=o.id}return o}
function av(o){return o.opt?o.ch:-1}
function inV(i,v){return v<0||!!i.vs[v]}
function all3(i){return i.vs[0]&&i.vs[1]&&i.vs[2]}
function grp(list){return list.filter(function(i){return i.type==='work'}).concat(list.filter(function(i){return i.type==='mat'}))}
function its(o,v,type){return o.items.filter(function(i){return i.type===type&&inV(i,v)})}
function sums(o,v){
 if(v===undefined)v=av(o);
 var w=0,m=0;
 o.items.forEach(function(i){if(!inV(i,v))return;var x=i.qty*i.price;if(i.type==='work')w+=x;else m+=x});
 return {w:w,m:m,t:w+m};
}
function addItem(o,type,name,unit,qty,price,vs){
 vs=vs||[true,true,true];
 var key=String(vs);
 var ex=o.items.filter(function(i){return i.type===type&&i.name===name&&i.price===price&&String(i.vs)===key})[0];
 if(ex)ex.qty+=qty;else o.items.push({id:uid(),type:type,name:name,unit:unit,qty:qty,price:price,vs:vs});
}
function pdig(p){var d=String(p||'').replace(/\D/g,'');if(d.length===11&&d.charAt(0)==='8')d='7'+d.slice(1);else if(d.length===10)d='7'+d;return d}
function phActs(o){
 var d=pdig(o.phone);
 if(d.length<11)return '<span class="mut">Введите номер, чтобы позвонить или написать</span>';
 return '<a class="btn pri" href="tel:+'+d+'">Позвонить</a><a class="btn" href="sms:+'+d+'">SMS</a><button data-a="cpph">Скопировать номер</button><a class="btn" href="https://t.me/+'+d+'" target="_blank" rel="noopener">Telegram</a>';
}
function meLine(){var m=st.me,a=[m.name||'—'];if(m.inn)a.push('ИНН '+m.inn);if(m.phone)a.push('тел. '+m.phone);return a.join(', ')}
function cliLine(o){return (o.client||'—')+(o.phone?', тел. '+o.phone:'')}
function warM(){var w=Math.round(num(st.me.war));return w>0?w:12}
function warEnd(){var e=new Date();e.setMonth(e.getMonth()+warM());return e.toLocaleDateString('ru-RU')}
function calc(c){
 var P=num(c.P),L=num(c.L),cos=num(c.cos)||1,ph=+c.phase===3?3:1;
 if(!(P>0))return null;
 var U=ph===3?400:230;
 var I=ph===3?P*1000/(1.732*U*cos):P*1000/(U*cos);
 var b=BR.filter(function(x){return x>=I})[0];
 if(!b)return {I:I,over:true};
 var idx=0;while(idx<SEC.length-1&&SEC[idx].b<b)idx++;
 function drop(s){return (ph===3?1.732:2)*0.0175*L*I/s/U*100}
 var base=SEC[idx].s;
 while(drop(SEC[idx].s)>3&&idx<SEC.length-1)idx++;
 var d=drop(SEC[idx].s);
 return {I:I,b:b,s:SEC[idx].s,drop:d,raised:SEC[idx].s>base,warn:d>3,ph:ph};
}
function totalsHtml(o){
 if(!o.opt){var s=sums(o);
  return '<div class="kv"><span>Работы</span><span>'+money(s.w)+'</span></div><div class="kv"><span>Материалы</span><span>'+money(s.m)+'</span></div><div class="kv big"><span>Итого</span><span>'+money(s.t)+'</span></div>';
 }
 return '<div class="mut" style="margin-bottom:6px">Выбор заказчика — нажмите на вариант</div>'+VN.map(function(n,v){
  return '<button class="vrow'+(o.ch===v?' on':'')+'" data-a="ch" data-v="'+v+'"><span>'+n+'</span><span>'+money(sums(o,v).t)+'</span></button>';
 }).join('')+'<p class="hint" style="margin:4px 0 0">Акт, гарантия и оплата считаются по выбранному варианту.</p>';
}
function resHtml(){
 var r=calc(st.calc);
 if(!r)return '<span class="mut">Введите мощность линии</span>';
 if(r.over)return '<div class="kv"><span>Расчётный ток</span><span>'+r.I.toFixed(1)+' А</span></div><div class="bad">Ток выше 80 А: нужен индивидуальный расчёт</div>';
 return '<div class="kv"><span>Расчётный ток</span><span>'+r.I.toFixed(1)+' А</span></div>'+
  '<div class="kv"><span>Автомат</span><span>'+(r.ph===3?'3P ':'1P ')+r.b+' А</span></div>'+
  '<div class="kv"><span>Кабель, медь</span><span>'+(r.ph===3?'5×':'3×')+sstr(r.s)+' мм²</span></div>'+
  '<div class="kv"><span>Падение напряжения</span><span class="'+(r.warn?'bad':'ok')+'">'+r.drop.toFixed(2)+' %</span></div>'+
  (r.raised?'<div class="mut">Сечение увеличено из-за длины линии</div>':'')+
  (r.warn?'<div class="bad">Падение выше 3 %: сократите длину или разделите нагрузку</div>':'');
}
function docText(o,k){
 var d=new Date().toLocaleDateString('ru-RU'),v=av(o),s=sums(o);
 var W=its(o,v,'work'),M=its(o,v,'mat');
 function ln(i){return '  '+i.name+' — '+fmt(i.qty)+' '+i.unit+' × '+money(i.price)+' = '+money(i.qty*i.price)}
 function lines(){return o.lines.map(function(l){return '  '+l.name+': '+fmt(l.P)+' кВт, '+l.phase+'ф, '+fmt(l.L)+' м — автомат '+l.b+' А, кабель '+sstr(l.s)+' мм², падение напряжения '+l.drop.toFixed(2)+' %'})}
 var head=['Исполнитель: '+meLine(),'Заказчик: '+cliLine(o),'Объект: '+(o.name||'—'),'Адрес: '+(o.address||'—')];
 if(o.opt&&k!=='kp')head.push('Вариант: «'+VN[o.ch]+'»');
 var out=[];
 if(k==='kp'&&o.opt){
  var C=grp(o.items.filter(all3));
  out=['Коммерческое предложение № '+o.num+' от '+d].concat(head,['','Входит во все варианты:'],C.length?C.map(ln):['  —']);
  for(var x=0;x<3;x++){
   var E=grp(o.items.filter(function(i){return i.vs[x]&&!all3(i)}));
   out.push('','Вариант «'+VN[x]+'»'+(E.length?', дополнительно:':': только общие позиции'));
   out=out.concat(E.map(ln));
   out.push('Итого «'+VN[x]+'»: '+money(sums(o,x).t));
  }
  if(o.lines.length)out=out.concat(['','Линии и защита:'],lines());
  out.push('','Сравнение вариантов:');
  VN.forEach(function(n,x){out.push('  '+n+' — '+money(sums(o,x).t))});
  out.push('','Предложение действительно 14 дней. Цены на материалы уточняются на день закупки.');
 }else if(k==='kp'){
  out=['Коммерческое предложение № '+o.num+' от '+d].concat(head,['','Работы:'],W.length?W.map(ln):['  —'],['Итого работы: '+money(s.w),'','Материалы:'],M.length?M.map(ln):['  —'],['Итого материалы: '+money(s.m)]);
  if(o.lines.length)out=out.concat(['','Линии и защита:'],lines());
  out=out.concat(['','Всего по смете: '+money(s.t),'','Предложение действительно 14 дней. Цены на материалы уточняются на день закупки.']);
 }else if(k==='act'){
  out=['Акт выполненных работ № '+o.num+' от '+d].concat(head,['','Выполненные работы:'],W.length?W.map(ln):['  —']);
  if(M.length)out=out.concat(['','Материалы:'],M.map(ln));
  out=out.concat(['','Стоимость работ: '+money(s.w),'Материалы: '+money(s.m),'Всего к оплате: '+money(s.t),'','Работы выполнены в полном объёме. Заказчик претензий по объёму, качеству и срокам не имеет.','','Исполнитель: ____________ '+(st.me.name||''),'Заказчик: ____________ '+(o.client||'')]);
 }else{
  out=['Гарантийный талон № '+o.num+' от '+d].concat(head,['','Гарантия на выполненные электромонтажные работы — '+warM()+' мес. с даты подписания акта, до '+warEnd()+'.','','Гарантия не распространяется на: повреждение проводки третьими лицами, самостоятельное изменение схемы, превышение расчётной нагрузки линий.']);
  if(o.lines.length)out=out.concat(['','Расчётные нагрузки линий:'],lines());
  out=out.concat(['','Исполнитель: ____________ '+(st.me.name||'')]);
 }
 return out.join('\n');
}
function docHtml(o,k){
 var d=new Date().toLocaleDateString('ru-RU'),v=av(o),s=sums(o),m=st.me;
 var W=its(o,v,'work'),M=its(o,v,'mat');
 function tbl(list){
  if(!list.length)return '<p>—</p>';
  return '<table><tr><th>№</th><th>Наименование</th><th>Ед.</th><th>Кол-во</th><th>Цена, ₽</th><th>Сумма, ₽</th></tr>'+list.map(function(i,n){
   return '<tr><td class="n">'+(n+1)+'</td><td>'+esc(i.name)+'</td><td>'+esc(i.unit)+'</td><td class="n">'+fmt(i.qty)+'</td><td class="n">'+rub(i.price)+'</td><td class="n">'+rub(i.qty*i.price)+'</td></tr>';
  }).join('')+'</table>';
 }
 function ltbl(){

 else if(ds.q||ds.p){
  var id=ds.q||ds.p,it=o.items.filter(function(i){return i.id===id})[0];if(!it)return;
  if(ds.q)it.qty=num(t.value);else it.price=num(t.value);
  var sm=root.querySelector('[data-sum="'+id+'"]');if(sm)sm.textContent=money(it.qty*it.price);
  var tot=document.getElementById('ms-tot');if(tot)tot.innerHTML=totalsHtml(o);
 }
 else if(ds.pct){st.pct=Math.min(100,Math.max(0,num(t.value)));var am=document.getElementById('ms-amt');if(am)am.textContent=money(sums(o).t*st.pct/100)}
 else return;
 save();
});
root.addEventListener('change',function(e){
 var t=e.target;
 if(t.dataset.c==='sel'){st.cur=t.value;save();render();return}
 if(t.id==='ms-file'){
  var f=t.files&&t.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
   var s;
   try{s=JSON.parse(rd.result);if(!(s&&s.objects&&s.objects.length))throw new Error('bad')}
   catch(err){alert('Не удалось прочитать файл. Выберите файл копии Мастер.Смета.');return}
   if(!confirm('Заменить текущие данные данными из файла?'))return;
   st=norm(s);save();render();alert('Данные загружены');
  };
  rd.readAsText(f);
  t.value='';
 }
});
render();
})();
</script>
</body>
